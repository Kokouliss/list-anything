# Every merge to main builds the debug APK (signed with app/debug.keystore, so Google
# sign-in accepts it) and publishes it on a release page. The newest one is always at
# https://github.com/Kokouliss/list-anything/releases/latest/download/list-anything.apk
name: Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk list-anything.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          generate_release_notes: true
          files: list-anything.apk
